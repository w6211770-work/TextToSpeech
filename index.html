<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英日読み上げ</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>英日読み上げアプリ</h1>

<label>開始行</label>
<input
type="number"
id="startLine"
min="1"
value="1">

<input
    type="file"
    id="fileInput"
    accept=".txt,.csv">

<br><br>

<button id="startBtn">開始</button>
<button id="stopBtn">停止</button>

<div id="status">
状態: 待機中
</div>

<div id="englishText"></div>
<div id="japaneseText"></div>

<script>
async function loadDefaultFile(){

    try{

        const response = await fetch("sample.txt");
        const text = await response.text();
        loadTxt(text);

        statusEl.textContent =
           `デフォルト読込完了 (${lines.length}件)`;

    }
    catch(error){

        statusEl.textContent =
            "デフォルトファイル読込失敗";

        console.error(error);

    }
}

let lines = [];

let currentIndex = 0;
let isReading = false;

const statusEl = document.getElementById("status");

let englishVoice = null;
let japaneseVoice = null;

function loadVoices() {

    const voices = speechSynthesis.getVoices();

    console.log("利用可能音声");

    voices.forEach(v => {
        console.log(v.name + " : " + v.lang);
    });

    // 英語音声優先
    englishVoice =
        voices.find(v =>
            v.name.includes("Google") &&
            v.lang.startsWith("en")
        ) ||
        voices.find(v =>
            v.lang === "en-US"
        ) ||
        voices.find(v =>
            v.lang.startsWith("en")
        );

    // 日本語音声
    japaneseVoice =
        voices.find(v =>
            v.lang === "ja-JP"
        ) ||
        voices.find(v =>
            v.lang.startsWith("ja")
        );

    console.log("英語音声:", englishVoice?.name);
    console.log("日本語音声:", japaneseVoice?.name);
}

// 音声一覧読込
loadVoices();
speechSynthesis.onvoiceschanged = loadVoices;




document
.getElementById("fileInput")
.addEventListener("change", async (e)=>{

    const file = e.target.files[0];

    if(!file){
        return;
    }

    const text = await file.text();

    if(file.name.endsWith(".csv")){
        loadCsv(text);
    }else{
        loadTxt(text);
    }

    currentIndex =
Number(
localStorage.getItem("currentIndex")
) || 0;
    statusEl.textContent =
        `ファイル読込完了 (${lines.length}件)`;

});




function loadTxt(text){

    const rawLines =
        text.split(/\r?\n/)
            .filter(v => v.trim());

    lines = [];

    for(let i=0;i<rawLines.length;i+=2){

        lines.push({
            english: rawLines[i] || "",
            japanese: rawLines[i+1] || ""
        });

    }

}

function loadCsv(text){

    const rows =
        text.split(/\r?\n/)
            .filter(v=>v.trim());

    lines = [];

    const startIndex =
        rows[0].includes("English") ||
        rows[0].includes("英語")
            ? 1
            : 0;

    for(let i=startIndex;i<rows.length;i++){

        const cols = rows[i].split(",");

        lines.push({
            english : cols[0]?.trim() || "",
            japanese : cols[1]?.trim() || ""
        });

    }

}

function speakPair(){

    if(currentIndex >= lines.length){
        isReading = false;
        return;
    }

    const row = lines[currentIndex];

    const englishText =
        document.getElementById("englishText");

    const japaneseText =
        document.getElementById("japaneseText");

    englishText.textContent =
        row.english;

    japaneseText.textContent =
        row.japanese;


    const en =
        new SpeechSynthesisUtterance(
            row.english
        );

    en.lang = "en-US";
    en.voice = englishVoice;
	en.onend = () => {
 	   const ja =
	        new SpeechSynthesisUtterance(
	            row.japanese
	        );

	    ja.lang = "ja-JP";
	    ja.voice = japaneseVoice;
	
ja.onend = () => {

    currentIndex++;

    localStorage.setItem(
        "currentIndex",
        currentIndex
    );

    if(isReading){
        speakPair();
    }
};
	
	    speechSynthesis.speak(ja);
	};

    speechSynthesis.speak(en);

}

document
.getElementById("startBtn")
.addEventListener("click", ()=>{

    if(lines.length === 0){
        alert("テキストファイルを選択してください。");
        return;
    }

    if(isReading){
        return;
    }

    const startLine =
        parseInt(
            document.getElementById("startLine").value
        ) || 1;

currentIndex =
    Math.max(
        0,
        Math.min(
            startLine - 1,
            lines.length - 1
        )
    );
    isReading = true;

    statusEl.textContent =
        `${currentIndex + 1}行目から読み上げ`;

    speakPair();
});

document.getElementById("startLine").max =
lines.length;

document
.getElementById("stopBtn")
.addEventListener("click", ()=>{

    isReading = false;

    speechSynthesis.cancel();

    statusEl.textContent =
        "停止";

});


loadDefaultFile();

</script>

</body>
</html>
