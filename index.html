<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英日読み上げ</title>

<link rel="manifest" href="manifest.json">

<style>

body{
    font-family:sans-serif;
    max-width:800px;
    margin:20px auto;
    padding:20px;

    background-color:#1e1e1e;
    color:#ffffff;
}

h1{
    text-align:center;
}

button{
    padding:10px 20px;
    margin:5px;
    cursor:pointer;

    background-color:#333333;
    color:#ffffff;
    border:1px solid #555555;
}

button:hover{
    background-color:#444444;
}

#status{
    margin-top:20px;
    padding:10px;
    background:#2d2d2d;
    border-radius:5px;
    color:#ffffff;
}

#currentLine{
    margin-top:10px;
    font-size:18px;
    color:#66b3ff;
}

</style>

</head>
<body>

<h1>英日読み上げアプリ</h1>

<input type="file" id="fileInput" accept=".txt">

<br><br>

<button id="startBtn">開始</button>
<button id="stopBtn">停止</button>

<div id="status">
状態: 待機中
</div>

<div id="currentLine">
</div>

<script>
async function loadDefaultFile(){

    try{

        const response = await fetch("sample.txt");

        const text = await response.text();

        lines = text
            .split(/\r?\n/)
            .map(v => v.trim())
            .filter(v => v !== "");

        currentIndex = 0;

        statusEl.textContent =
            `デフォルトファイル読込完了 (${lines.length}行)`;

    }
    catch(error){

        statusEl.textContent =
            "デフォルトファイル読込失敗";

        console.error(error);

    }
}

let lines = [];
let currentIndex = 0;
let isReading = false;

const statusEl = document.getElementById("status");
const currentLineEl = document.getElementById("currentLine");

let englishVoice = null;
let japaneseVoice = null;

function loadVoices() {

    const voices = speechSynthesis.getVoices();

    console.log("利用可能音声");

    voices.forEach(v => {
        console.log(v.name + " : " + v.lang);
    });

    // 英語音声優先
    englishVoice =
        voices.find(v =>
            v.name.includes("Google") &&
            v.lang.startsWith("en")
        ) ||
        voices.find(v =>
            v.lang === "en-US"
        ) ||
        voices.find(v =>
            v.lang.startsWith("en")
        );

    // 日本語音声
    japaneseVoice =
        voices.find(v =>
            v.lang === "ja-JP"
        ) ||
        voices.find(v =>
            v.lang.startsWith("ja")
        );

    console.log("英語音声:", englishVoice?.name);
    console.log("日本語音声:", japaneseVoice?.name);
}

// 音声一覧読込
loadVoices();
speechSynthesis.onvoiceschanged = loadVoices;


function isJapanese(text){

    return /[\u3040-\u30ff\u4e00-\u9fff]/.test(text);

}

document
.getElementById("fileInput")
.addEventListener("change", async(event)=>{

    const file = event.target.files[0];

    if(!file){
        return;
    }

    const text = await file.text();

    lines = text
        .split(/\r?\n/)
        .map(v => v.trim())
        .filter(v => v !== "");

    currentIndex = 0;

    statusEl.textContent =
        `ファイル読込完了 (${lines.length}行)`;

});

function speakNext(){

    if(!isReading){
        return;
    }

    if(currentIndex >= lines.length){

        statusEl.textContent =
            "読み上げ完了";

        isReading = false;
        return;
    }

    const text = lines[currentIndex];

    currentLineEl.textContent =
        `読上げ中: ${text}`;

    const utterance =
        new SpeechSynthesisUtterance(text);

if(isJapanese(text)) {

    utterance.lang = "ja-JP";

    if(japaneseVoice){
        utterance.voice = japaneseVoice;
    }

} else {

    utterance.lang = "en-US";

    if(englishVoice){
        utterance.voice = englishVoice;
    }

}

    utterance.rate = 2.0;
    utterance.pitch = 1.2;
    utterance.volume = 1.0;

    utterance.onend = () => {

        currentIndex++;

        setTimeout(() => {

            speakNext();

        }, 500);

    };

    speechSynthesis.cancel();
    speechSynthesis.speak(utterance);
}

document
.getElementById("startBtn")
.addEventListener("click", ()=>{

    if(lines.length === 0){

        alert("テキストファイルを選択してください。");
        return;
    }

    if(isReading){
        return;
    }

    isReading = true;

    statusEl.textContent =
        "読み上げ中";

    speakNext();
});

document
.getElementById("stopBtn")
.addEventListener("click", ()=>{

    isReading = false;

    speechSynthesis.cancel();

    statusEl.textContent =
        "停止";

});


loadDefaultFile();

</script>

</body>
</html>
